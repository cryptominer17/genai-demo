# Nginx production config for FI GenAI PoC Platform
# 3 Streamlit apps: Document Intelligence (8501), Data Q&A (8502), Report Generator (8503)
# Ubuntu 22.04 LTS — Digital Ocean, Virginia region

# Upstream definitions
upstream doc_intelligence {
    server localhost:8501;
    keepalive 32;
}

upstream data_qa {
    server localhost:8502;
    keepalive 32;
}

upstream report_generator {
    server localhost:8503;
    keepalive 32;
}

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml+rss application/atom+xml image/svg+xml
           text/javascript application/x-javascript;
gzip_min_length 256;

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/fi-genai-poc-access.log;
    error_log  /var/log/nginx/fi-genai-poc-error.log;

    # ----------------------------------------------------------------
    # Health check endpoint
    # ----------------------------------------------------------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # ----------------------------------------------------------------
    # Document Intelligence  →  port 8501
    # ----------------------------------------------------------------
    location /Document_AI {
        proxy_pass http://doc_intelligence;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;

        # Trailing slash redirect
        rewrite ^/Document_AI$ /Document_AI/ permanent;
    }

    location /Document_AI/ {
        proxy_pass http://doc_intelligence/Document_AI/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;
    }

    # ----------------------------------------------------------------
    # Data Q&A (Text-to-SQL)  →  port 8502
    # ----------------------------------------------------------------
    location /Text_to_SQL {
        rewrite ^/Text_to_SQL$ /Text_to_SQL/ permanent;
    }

    location /Text_to_SQL/ {
        proxy_pass http://data_qa/Text_to_SQL/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;
    }

    # ----------------------------------------------------------------
    # Report Generator (BI Dashboard)  →  port 8503
    # ----------------------------------------------------------------
    location /BI_Dashboard {
        rewrite ^/BI_Dashboard$ /BI_Dashboard/ permanent;
    }

    location /BI_Dashboard/ {
        proxy_pass http://report_generator/BI_Dashboard/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;
    }

    # ----------------------------------------------------------------
    # Default — redirect root to Document Intelligence
    # ----------------------------------------------------------------
    location = / {
        return 302 /Document_AI/;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
