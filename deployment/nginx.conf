upstream doc_intelligence {
    server localhost:8501;
    keepalive 32;
}

upstream data_qa {
    server localhost:8502;
    keepalive 32;
}

upstream report_generator {
    server localhost:8503;
    keepalive 32;
}

upstream admin {
    server localhost:8504;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;
    access_log /var/log/nginx/fi-genai-poc-access.log;
    error_log  /var/log/nginx/fi-genai-poc-error.log;

    # ── Health check ──────────────────────────────────────────────────────────
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # ── Landing page (root) ───────────────────────────────────────────────────
    location = / {
        root /var/www/fi-genai-poc/landing;
        try_files /index.html =404;
    }

    # ── Admin panel ───────────────────────────────────────────────────────────
    location /admin/ {
        alias /var/www/fi-genai-poc/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ── Document AI (:8501) ───────────────────────────────────────────────────
    location /Document_AI {
        rewrite ^/Document_AI$ /Document_AI/ permanent;
    }

    location /Document_AI/ {
        proxy_pass         http://doc_intelligence/Document_AI/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout    86400;
        proxy_send_timeout    86400;
        proxy_connect_timeout 60;
    }

    # ── Data Q&A / Text-to-SQL (:8502) ───────────────────────────────────────
    location /Text_to_SQL {
        rewrite ^/Text_to_SQL$ /Text_to_SQL/ permanent;
    }

    location /Text_to_SQL/ {
        proxy_pass         http://data_qa/Text_to_SQL/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout    86400;
        proxy_send_timeout    86400;
        proxy_connect_timeout 60;
    }

    # ── Report Generator / BI Dashboard (:8503) ──────────────────────────────
    location /BI_Dashboard {
        rewrite ^/BI_Dashboard$ /BI_Dashboard/ permanent;
    }

    location /BI_Dashboard/ {
        proxy_pass         http://report_generator/BI_Dashboard/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout    86400;
        proxy_send_timeout    86400;
        proxy_connect_timeout 60;
    }

    # ── Admin Streamlit App (:8504) ───────────────────────────────────────────
    location /Admin {
        rewrite ^/Admin$ /Admin/ permanent;
    }

    location /Admin/ {
        proxy_pass         http://admin/Admin/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout    86400;
        proxy_send_timeout    86400;
        proxy_connect_timeout 60;
    }

    # ── Block hidden files ────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
